# Memo: Phase 1 DokoTsubu3. DB settings stay external. Gemini model is non-secret. API key may be empty at startup.

server.servlet.context-path=/dokoTsubu
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
dokotsubu.db.url=${DOKOTSUBU_DB_URL}
dokotsubu.db.username=${DOKOTSUBU_DB_USERNAME}
