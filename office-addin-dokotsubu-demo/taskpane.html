<!DOCTYPE html>
<!--
ソース名: taskpane.html
Lang: HTML
Function: タスクペイン用の骨格マークアップ（ヘッダー・操作ボタン・投稿一覧コンテナ）
Note: 説明用デモ。スタイルは taskpane.css、描画は taskpane.js。
Author:Takashi Oikawa
Date:2026/04/03
LastUp:2026/04/04
-->
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>どこつぶ（デモ）</title>
  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>
  <div class="app-shell" id="app-root">
    <header class="app-header" role="banner">
      <h1 class="app-title">どこつぶ</h1>
      <p class="app-subtitle">説明用デモ（投稿一覧のみ）</p>
    </header>

    <section class="toolbar" aria-label="操作">
      <button type="button" class="btn btn-primary" id="btn-post">投稿する</button>
      <button type="button" class="btn btn-secondary" id="btn-refresh">更新</button>
    </section>

    <main class="feed" id="feed" aria-live="polite">
      <p class="feed-placeholder" id="feed-placeholder">読み込み中…</p>
    </main>
  </div>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <script src="taskpane.js" type="text/javascript"></script>
</body>
</html>
